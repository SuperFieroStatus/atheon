# Render Blueprint — Atheon
# Deploy: Render dashboard → New → Blueprint → connect this repo → Apply.
#
# One always-on Node web service that serves both the API and the built React
# client, with a small persistent disk holding the SQLite database file.
#
# Cost: web "starter" (~$7/mo, always-on) + a 1 GB disk (~$0.25/mo).
# Nothing to fill in by hand — JWT_SECRET is generated by Render on first deploy.

services:
  - type: web
    name: atheon
    runtime: node
    plan: starter            # always-on, no cold starts
    region: virginia         # US-East
    branch: main
    autoDeploy: true         # redeploy on push to main
    buildCommand: npm ci --include=dev && npm run build   # --include=dev so vite/tsc are available to build the client
    startCommand: npm run start
    healthCheckPath: /api/health
    # Persistent disk for the SQLite database. Pins the service to one instance
    # (fine for a pilot) and survives restarts/redeploys.
    disk:
      name: atheon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"      # Atheon uses Node's built-in node:sqlite (needs Node >= 24 to run unflagged)
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data      # SQLite file lives on the persistent disk
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret
